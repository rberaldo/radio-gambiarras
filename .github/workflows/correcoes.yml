# Applies an approved repeater correction. A maintainer reviews an issue made
# with the "Correção de repetidora" form and adds the label `aprovada`; this
# job writes the correction into data/repeaters/overlay.json, commits (which
# deploys the site), comments and closes the issue. If the issue cannot be
# applied, it comments why and removes the label.
# The issue text only ever reaches the script through environment variables.
name: Aplicar correção

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.label.name == 'aprovada'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      # The runner context is not allowed here, so a fixed path on the runner.
      RESULT_FILE: /tmp/resultado.md
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Applies the correction on top of the latest main and pushes; if another
      # job pushed first (the daily refresh, another approval), starts over.
      # No concurrency group: GitHub would cancel all but one queued approval.
      - name: Apply, commit and push
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            node scripts/repeaters/apply-issue.ts
            git add data/repeaters/overlay.json
            if git diff --cached --quiet; then
              echo "Overlay unchanged."
              exit 0
            fi
            REPEATER=$(sed -n 's/^id=//p' "$GITHUB_OUTPUT" | tail -1)
            git commit --quiet -m "Apply repeater correction for $REPEATER (#$ISSUE_NUMBER)"
            if git push --quiet origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Reply and close
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat "$RESULT_FILE")"

      - name: Report problems
        if: failure()
        run: |
          if [ ! -s "$RESULT_FILE" ]; then
            echo "Não consegui aplicar esta correção por um erro no fluxo: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RESULT_FILE"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RESULT_FILE"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label aprovada
