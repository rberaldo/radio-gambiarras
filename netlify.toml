[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"

# Files under /_astro/ have a content hash in their name (including the
# callsign data), so a new version always gets a new URL: browsers can keep
# them forever. Pages keep Netlify's default (always revalidate), so a new
# deploy shows up immediately and points to the new files.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
